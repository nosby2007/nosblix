<main class="academy"><section class="search-hero"><span class="eyebrow">COURSE LIBRARY</span><h1>Find a course</h1><label for="courseSearch">Search by topic</label><input id="courseSearch" type="search" [(ngModel)]="query" placeholder="Search courses..." /></section><section class="section"><div class="course-grid"><ng-container *ngFor="let course of courses$|async"><a class="course-card" *ngIf="matches(course)" [routerLink]="['/course',course.id]"><div class="course-art"><span>{{course.category}}</span><strong>✚</strong></div><div class="course-body"><small>{{course.level}} · {{course.duration}}</small><h3>{{course.title}}</h3><p>{{course.description}}</p><span class="course-link">View course →</span></div></a></ng-container></div></section></main>
