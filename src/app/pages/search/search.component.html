<main class="academy"><section class="search-hero"><span class="eyebrow">COURSE LIBRARY</span><h1>Find your next course</h1><label for="courseSearch">Search by title, topic or category</label><input id="courseSearch" type="search" [(ngModel)]="query" placeholder="Try anatomy, prevention, documentation..." /></section><section class="section"><h2>{{results.length}} course(s) found</h2><div class="course-grid"><a class="course-card" *ngFor="let course of results" [routerLink]="['/course',course.id]"><div class="course-art"><span>{{course.category}}</span><strong>✚</strong></div><div class="course-body"><small>{{course.level}} · {{course.duration}}</small><h3>{{course.title}}</h3><p>{{course.description}}</p><span class="course-link">View course →</span></div></a></div><p *ngIf="!results.length">No courses match your search.</p></section></main>
